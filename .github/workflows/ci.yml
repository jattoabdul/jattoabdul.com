name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Allow only one concurrent CI run per ref; cancel in-progress runs on a new push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Content and motion invariants
        run: npm run test:content

      - name: Build Workers bundle
        run: npm run build:worker

      - name: Check rendered pages and migration URLs
        run: |
          npm start -- --port 3015 > /tmp/site-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          node -e "let tries=0; const check=()=>fetch('http://127.0.0.1:3015').catch(()=>{if(++tries>30)process.exit(1);return new Promise(r=>setTimeout(r,1000)).then(check)});check()"
          npm run test:migration
